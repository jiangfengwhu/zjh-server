# Public listener while business/data migration is unfinished. Do not expose
# partial Go routes merely because the certificate has been issued.
server {
    listen 80;
    server_name zijinhua.297782.xyz;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }
    location / {
        default_type application/json;
        return 503 '{"message":"服务迁移中"}';
    }
}
