# TLS is ready but business/data migration is not complete.
server {
    listen 80;
    server_name zijinhua.297782.xyz;
    server_tokens off;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name zijinhua.297782.xyz;
    ssl_certificate /etc/letsencrypt/live/zijinhua.297782.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zijinhua.297782.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    location / {
        default_type application/json;
        return 503 '{"message":"服务迁移中"}';
    }
}
