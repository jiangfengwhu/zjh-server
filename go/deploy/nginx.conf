# Install only after the Go route/data parity checks have passed and the
# Let's Encrypt certificate exists. This file is not enabled by this repository.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' '';
}
upstream shenghua_api {
    server 127.0.0.1:8080;
    keepalive 16;
}
server {
    listen 80;
    server_name zijinhua.297782.xyz;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name zijinhua.297782.xyz;
    ssl_certificate /etc/letsencrypt/live/zijinhua.297782.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zijinhua.297782.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    server_tokens off;
    client_max_body_size 52m;
    client_body_timeout 60s;
    # Do not log the query string: shared application URLs can carry user data.
    access_log off;
    location / {
        proxy_pass http://shenghua_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
